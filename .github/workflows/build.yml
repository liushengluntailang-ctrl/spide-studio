
name: SPIDE Studio Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SPIDE Studio
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build SPIDE Studio
        run: cmake --build build-windows --target SpideStudio --config Release --parallel 2

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "build-windows/SpideStudio.exe"

          if (!(Test-Path $exe)) {
            Write-Host "Build directory contents:"
            Get-ChildItem build-windows -Recurse |
              Select-Object -First 100 FullName

            throw "SpideStudio.exe was not generated."
          }

          Write-Host "Found SPIDE Studio: $exe"

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-windows/SpideStudio.exe dist/

          windeployqt --release --compiler-runtime `
            --dir dist dist/SpideStudio.exe

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* `
            -DestinationPath SPIDE-Studio-Windows.zip -Force

      - name: Upload SPIDE Studio
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-Windows
          path: SPIDE-Studio-Windows.zip
          if-no-files-found: error
