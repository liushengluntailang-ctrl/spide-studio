
name: SPIDE Studio Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}/.."

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Collect EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $files = Get-ChildItem -Path build -Filter *.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\CMakeFiles\\|\\_deps\\' }

          if (-not $files) {
            throw "No EXE files were generated. Check the CMake build output."
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName dist/
          }

      - name: Deploy Qt Runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1

          if (-not $exe) {
            throw "Executable not found."
          }

          windeployqt --release --dir dist $exe.FullName

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* `
            -DestinationPath SPIDE-Studio-Windows.zip `
            -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-Windows
          path: SPIDE-Studio-Windows.zip
          if-no-files-found: error
