
name: SPIDE Studio Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SPIDE Studio EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install aqtinstall
        run: python -m pip install aqtinstall==3.2.1

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:\Qt

          if (!(Test-Path "C:\Qt\6.8.3\msvc2022_64\lib\cmake\Qt6")) {
            throw "Qt installation failed."
          }

          "C:\Qt\6.8.3\msvc2022_64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

          "CMAKE_PREFIX_PATH=C:\Qt\6.8.3\msvc2022_64" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: >
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build SPIDE Studio
        run: cmake --build build-windows --target SpideStudio --parallel 2

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "build-windows/SpideStudio.exe"

          if (!(Test-Path $exe)) {
            throw "SpideStudio.exe was not generated."
          }

          Write-Host "SPIDE Studio EXE generated successfully."

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item build-windows/SpideStudio.exe dist/

          windeployqt --release --compiler-runtime `
            --dir dist dist/SpideStudio.exe

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* `
            -DestinationPath SPIDE-Studio-Windows.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-Windows
          path: SPIDE-Studio-Windows.zip
          if-no-files-found: error
