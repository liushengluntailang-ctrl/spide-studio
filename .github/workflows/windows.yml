
name: SPIDE Studio Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean all old CMake caches
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter CMakeCache.txt -Recurse -Force |
            ForEach-Object {
              $dir = $_.Directory.FullName
              Write-Host "Removing stale build directory: $dir"
              Remove-Item $dir -Recurse -Force
            }

          Remove-Item build, build-windows, dist -Recurse -Force -ErrorAction SilentlyContinue

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          setup-python: false
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build-windows --config Release --target SpideStudio --parallel 2

      - name: Verify
        shell: pwsh
        run: |
          $exe = "build-windows/Release/SpideStudio.exe"
          if (!(Test-Path $exe)) {
            throw "SpideStudio.exe not found: $exe"
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-windows/Release/SpideStudio.exe dist/

          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
            --release --compiler-runtime --no-translations `
            dist/SpideStudio.exe

          if ($LASTEXITCODE -ne 0) {
            throw "Qt deployment failed"
          }

          Compress-Archive -Path dist/* `
            -DestinationPath SPIDE-Studio-Windows.zip -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-Windows
          path: SPIDE-Studio-Windows.zip
          if-no-files-found: error
