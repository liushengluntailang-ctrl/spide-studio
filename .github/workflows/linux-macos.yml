
name: SPIDE Studio Linux and macOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux ELF
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1 \
            file \
            wget

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.0

      - name: Check Qt architectures
        run: |
          python -m aqt list-qt linux desktop --arch 6.8.3

      - name: Install Qt 6.8.3
        shell: bash
        run: |
          python -m aqt install-qt linux desktop 6.8.3 gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"

          QT_ROOT="$RUNNER_TEMP/Qt/6.8.3/gcc_64"

          if [ ! -d "$QT_ROOT/lib/cmake/Qt6" ]; then
            echo "Qt installation failed."
            exit 1
          fi

          echo "QT_ROOT_DIR=$QT_ROOT" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          rm -rf build-linux
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: |
          cmake --build build-linux --parallel 2

      - name: Verify ELF
        run: |
          test -f build-linux/SpideStudio
          file build-linux/SpideStudio

      - name: Bundle Qt dependencies
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy

          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt

          chmod +x linuxdeploy linuxdeploy-plugin-qt

          export PATH="$PWD:$PATH"
          export LINUXDEPLOY_PLUGIN_DIR="$PWD"
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./linuxdeploy \
            --appdir AppDir \
            --executable build-linux/SpideStudio \
            --plugin qt

      - name: Package Linux
        run: |
          tar -czf SPIDE-Studio-Linux.tar.gz AppDir

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-Linux
          path: SPIDE-Studio-Linux.tar.gz
          if-no-files-found: error

  macos:
    name: Build macOS APP
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall==3.3.0

      - name: Check Qt architectures
        run: |
          python -m aqt list-qt mac desktop --arch 6.8.3

      - name: Install Qt 6.8.3
        shell: bash
        run: |
          python -m aqt install-qt mac desktop 6.8.3 clang_64 \
            --outputdir "$RUNNER_TEMP/Qt"

          QT_ROOT="$RUNNER_TEMP/Qt/6.8.3/clang_64"

          if [ ! -d "$QT_ROOT/lib/cmake/Qt6" ]; then
            echo "Qt installation failed."
            exit 1
          fi

          echo "QT_ROOT_DIR=$QT_ROOT" >> "$GITHUB_ENV"
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$QT_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          rm -rf build-macos
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_MACOSX_BUNDLE=ON

      - name: Build
        run: |
          cmake --build build-macos --parallel 2

      - name: Verify APP
        run: |
          test -d build-macos/SpideStudio.app
          test -f build-macos/SpideStudio.app/Contents/MacOS/SpideStudio

      - name: Deploy Qt
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" \
            build-macos/SpideStudio.app \
            -always-overwrite

      - name: Package macOS
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-macos/SpideStudio.app \
            SPIDE-Studio-macOS.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: SPIDE-Studio-macOS
          path: SPIDE-Studio-macOS.zip
          if-no-files-found: error
